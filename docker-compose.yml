services:
  # 1. La Base de Données
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=mytodo_db
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    

  # 2. Le Backend (Django Ninja)
  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/mytodo_db
      - DEBUG=1
    depends_on:
      db:
        condition: service_healthy

  # 3. Le Frontend (React)
  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true # Utile pour le hot-reload sur certains OS
    stdin_open: true
    depends_on:
      - backend

volumes:
  postgres_data: